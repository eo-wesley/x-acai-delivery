name: CI/CD — X-Açaí SaaS Platform

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  # ============================================================
  # 1. BUILD & VALIDATE
  # ============================================================
  build-and-test:
    name: Build & Validate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: xacai_test
          POSTGRES_USER: xacai_test
          POSTGRES_PASSWORD: ci_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xacai_test -d xacai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            apps/backend/package-lock.json
            apps/frontend/package-lock.json

      - name: Install Backend Dependencies
        run: npm ci
        working-directory: apps/backend

      - name: Build Backend (TypeScript)
        run: npm run build
        working-directory: apps/backend

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: apps/frontend

      - name: Build Frontend (Next.js)
        run: npm run build
        working-directory: apps/frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000
          # Firebase validates the public web-config shape while Next.js prerenders.
          # Production values are owned by Vercel; CI only needs inert placeholders.
          NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci.invalid
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-build
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-build.invalid
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
          NEXT_PUBLIC_FIREBASE_APP_ID: '1:000000000000:web:0000000000000000000000'

      - name: Run Backend Test Suite
        run: npm test
        working-directory: apps/backend
        env:
          TEST_POSTGRES_URL: postgres://xacai_test:ci_test_only@127.0.0.1:5432/xacai_test

  # ============================================================
  # 2. DOCKER BUILD (on push to main/production only)
  # ============================================================
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check registry configuration
        id: registry
        env:
          REGISTRY_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$REGISTRY_USERNAME" ] && [ -n "$REGISTRY_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            if [ "$GITHUB_REF" = "refs/heads/production" ]; then
              echo "::error::Configure DOCKERHUB_USERNAME and DOCKERHUB_TOKEN before a production release."
              exit 1
            fi
            echo "::notice::Registry credentials are absent; validating the image without publishing it."
          fi

      - name: Login to Docker Hub
        if: steps.registry.outputs.configured == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Backend Image (publish only with configured registry)
        uses: docker/build-push-action@v5
        with:
          context: apps/backend
          file: apps/backend/Dockerfile
          push: ${{ steps.registry.outputs.configured == 'true' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/xacai-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/xacai-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The public frontend is deployed by Vercel. Keeping its image out of this
      # VPS pipeline prevents an unconfigured Firebase build from blocking the
      # backend release or replacing the canonical frontend.

  # ============================================================
  # 3. DEPLOY (on push to production only)
  # ============================================================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/production'
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/xacai-delivery
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
            echo "✅ Deployment complete at $(date)"
